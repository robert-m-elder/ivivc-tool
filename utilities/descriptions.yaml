# Human-editable text used by the app, reports, and generated documentation.
# Keep routine wording changes here when possible, then restart the Flask app.
# Regenerate Markdown/PDF documentation after edits that should appear in the guide.
#
# Optional override sections supported by utilities/descriptions.py:
#   approaches, preprocessing, metrics, cv_scheme_labels, analysis_config_labels,
#   grid_search_description_html, modal_help, and tool.
# You may override only the specific keys you want to change.

tool:
  purpose_html: |
    <p>Establishing an in vitro-in vivo correlation (IVIVC) can support the evaluation of medical devices that include absorbable polymers by relating in vivo changes in material properties over time to corresponding in vitro test results, such as degradation profiles.</p>
    <p>IVIVCs may help evaluate manufacturing or material changes, support predictions of in vivo performance when modifying an existing device design, and reduce reliance on animal studies during preclinical development.</p>
    <p>This tool is intended to facilitate IVIVC development. The user supplies paired in vitro and in vivo fitting data, and may optionally supply an in vitro prediction dataset. The app applies selected preprocessing steps, fits and compares multiple correlation approaches and model families, evaluates selected performance metrics and cross-validation results, generates fitting and prediction plots, and produces report-ready summaries that can be reviewed and incorporated into external documentation.</p>
  purpose_text: >
    Establishing an in vitro-in vivo correlation (IVIVC) can support the evaluation of medical devices that include absorbable polymers by relating in vivo changes in material properties over time to corresponding in vitro test results, such as degradation profiles. IVIVCs may help evaluate manufacturing or material changes, support predictions of in vivo performance when modifying an existing device design, and reduce reliance on animal studies during preclinical development. This tool is intended to facilitate IVIVC development. The user supplies paired in vitro and in vivo fitting data, and may optionally supply an in vitro prediction dataset. The app applies selected preprocessing steps, fits and compares multiple correlation approaches and model families, evaluates selected performance metrics and cross-validation results, generates fitting and prediction plots, and produces report-ready summaries that can be reviewed and incorporated into external documentation.
  capability_summary:
    - Apply selected normalization, scaling, and interpolation options to prepare fitting and prediction data.
    - Fit user-selected IVIVC approaches and model families to paired in vitro and in vivo data.
    - Calculate selected goodness-of-fit, model-comparison, and cross-validation metrics.
    - Generate fitting, comparison, and prediction plots with uncertainty displays where supported.
    - Create report-ready HTML and editable Word summaries for user-selected final models or methods.

modal_help:
  index:
    preprocessing_overview_html: |
      <p>Transform your data before analysis to improve model fitting and comparability. The selected preprocessing choices are included in the results and downloadable Word report.</p>
      <ul>
        <li><strong>Normalization:</strong> optional transformations applied to response values.</li>
        <li><strong>Scaling:</strong> optional mathematical transformations applied to time or response values.</li>
        <li><strong>Interpolation:</strong> methods used to create matched time and response grids for fitting or direct mapping.</li>
      </ul>
      <p>For details on individual preprocessing options, use the help buttons next to Normalization, Scaling, and Interpolation.</p>
    advanced_analysis_overview_html: |
      <p>Advanced analysis parameters control how the app estimates out-of-sample performance and how it initializes nonlinear model fitting.</p>
      <ul>
        <li><strong>Cross-validation:</strong> controls how fitting data are split into training and holdout subsets for validation metrics.</li>
        <li><strong>Grid search:</strong> controls the automated search for suitable starting parameter values before nonlinear least-squares fitting.</li>
      </ul>
      <p>Default settings are intended to be reasonable starting points. Users may adjust these settings when datasets are small, fits are unstable, or a reproducible analysis configuration is needed.</p>
    cross_validation_html: |
      <p>Cross-validation estimates how selected fitted models perform on held-out data. It is used for Approaches 1 and 2, where parametric models are fitted.</p>
      <ul>
        <li><strong>Scheme:</strong> selects the splitting method, such as Shuffle split, K-fold, Leave-one-out, or None.</li>
        <li><strong>Splits/folds:</strong> controls the number of repeated splits or folds where applicable.</li>
        <li><strong>Test size:</strong> controls the held-out fraction for Shuffle split.</li>
        <li><strong>Random seed:</strong> makes randomized splitting reproducible.</li>
      </ul>
      <p>Very small datasets may produce unstable or unavailable validation metrics, especially when many folds or large holdout fractions are requested.</p>
    grid_search_html: |
      <p>The app conducts an automated grid search to identify suitable starting parameter values for each model before nonlinear least-squares fitting, avoiding the need for manual parameter tuning. The grid-search settings control the number of candidate starting points, the real-space parameter bounds, and the random seed used for reproducible sampling.</p>
      <p>For each selected model, the app evaluates multiple candidate starting points and uses the best candidate as the starting point for the final curve fit. The grid-search seed makes this random sampling reproducible.</p>
      <p>The grid search makes it more likely for the app to identify suitable starting parameters, but it does not guarantee that the final fitted parameters are the global optimum.</p>
      <p>If fitting fails or appears unstable, consider increasing the number of candidate starting points, widening or narrowing the parameter bounds, changing the random seed, or reviewing whether the selected model is appropriate for the data.</p>
  results:
    model_comparison_html: |
      <p>This section summarizes how each fitted model performed under the user-selected metrics. Use these results together with the fitting plots, prediction plots where available, parameter uncertainty, residual behavior, and scientific expectations for the system.</p>
      <p>The metric definitions and better/worse direction are shown in the Model Comparison tab itself, so this help box intentionally provides only a high-level interpretation guide.</p>
      <ul>
        <li>Lower error metrics such as MSE, RMSE, NRMSE, and mean-normalized RMSE generally indicate smaller residuals.</li>
        <li>Higher R² or adjusted R² values generally indicate that the fitted model explains more response variability.</li>
        <li>Lower AIC or BIC values can support relative comparison among models fitted to the same dataset under comparable error assumptions.</li>
      </ul>
      <p>The app does not automatically choose a regulatory final model. The user should review the full set of outputs and select the model or method that is scientifically justified for the intended use.</p>

# Human-editable text used by the app, reports, and generated documentation.
# Routine wording changes should be made here. Restart the Flask app after edits.
# Regenerate LaTeX/PDF documentation after edits that should appear in the guide.

tool:
  purpose_html: |-
    <p>Establishing an in vitro-in vivo correlation (IVIVC) can support the evaluation of medical devices that include absorbable polymers by relating in vivo changes in material properties over time to corresponding in vitro test results, such as degradation profiles.</p>
    <p>Potential uses of IVIVCs include evaluating manufacturing or material changes and supporting predictions of in vivo performance when modifying an existing device design.</p>
    <p>This tool is intended to facilitate IVIVC development. The user supplies paired in vitro and in vivo fitting data; an optional in vitro prediction dataset can also be supplied. The app applies selected preprocessing steps, fits and compares multiple correlation approaches and model families, evaluates selected performance metrics and cross-validation results, generates fitting and prediction plots, and produces report-ready summaries for user review and external documentation.</p>
    <p>The app provides information to support user review of models. It does not select or recommend a model or determine regulatory acceptability. The app and user guide are advisory; they do not establish requirements, acceptance criteria, or a prescribed model-selection process. Users are responsible for determining how to document their model-selection rationale, consistent with the intended use and applicable credibility considerations.</p>
  purpose_text: |
    Establishing an in vitro-in vivo correlation (IVIVC) can support the evaluation of medical devices that include absorbable polymers by relating in vivo changes in material properties over time to corresponding in vitro test results, such as degradation profiles. Potential uses of IVIVCs include evaluating manufacturing or material changes and supporting predictions of in vivo performance when modifying an existing device design. This tool is intended to facilitate IVIVC development. The user supplies paired in vitro and in vivo fitting data; an optional in vitro prediction dataset can also be supplied. The app applies selected preprocessing steps, fits and compares multiple correlation approaches and model families, evaluates selected performance metrics and cross-validation results, generates fitting and prediction plots, and produces report-ready summaries for user review and external documentation.
  capability_summary:
  - Applies selected normalization and scaling, and uses interpolation where required for paired-data approaches and mappings.
  - Fits user-selected IVIVC approaches and model families to paired in vitro and in vivo data.
  - Calculates selected goodness-of-fit, model-comparison, and cross-validation metrics.
  - Generates fitting, comparison, and prediction plots with uncertainty displays where supported.
  - Creates summaries for user-selected approaches or models for downstream review and documentation.
approaches:
  approach1:
    title: 'Approach 1: Direct Correlation'
    method_html: |-
      <p>Approach 1 directly relates the in vitro and in vivo times associated with the same response values after preprocessing (i.e., in vivo time is modeled as a function of in vitro time). When the datasets do not contain the same response values, the app can interpolate time at shared response values to create the paired times used for fitting. The fitted model is then used as a time-scaling function that maps an in vitro time to a predicted in vivo time.</p>
      <p>This approach may be relevant when a key analytical question concerns how in vitro time at a given response corresponds to in vivo time at that response.</p>
    fit_uncertainty_html: "\n            <p><strong>Parameter estimates:</strong> fitted parameters are reported as estimate ± 95% confidence interval. The plus-minus value is calculated from the fitted model's covariance matrix, parameter standard errors, and residual degrees of freedom. It summarizes how precisely each parameter was estimated from the available data.</p>\n            <p><strong>Fitting plot bands:</strong> shaded 95% prediction bands are generated by Monte Carlo sampling of the fitted parameter covariance matrix. The sampled model variance is combined with the residual variance from the fitted data, then converted to a two-sided interval using the appropriate Student's t multiplier when residual degrees of freedom are available.</p>\n            <p>These bands describe approximate prediction uncertainty around the fitted relationship. They are not intended to define acceptability thresholds; interpretation depends on the fitted model form, local covariance approximation, residual behavior, preprocessing choices, and intended use.</p>\n        "
    prediction_error_html: "\n            <p><strong>Prediction plot error bars:</strong> when a prediction dataset is supplied, predicted in vivo times are plotted with horizontal error bars. The bars are calculated from the same 95% prediction-band calculation used for the fitted correlation model; the upper and lower bar lengths are the distances from the band mean to the corresponding upper and lower interval bounds at each input prediction time.</p>\n            <p>The error bars therefore include propagated fitted-parameter uncertainty and residual/model error from the Approach 1 correlation fit.</p>\n        "
  approach2:
    title: 'Approach 2: Independent Model Fitting'
    method_html: |-
      <p>Approach 2 fits the same model family (e.g., exponential decay) separately to the preprocessed observed in vitro and in vivo datasets. The two datasets do not need matching time points or response values, so interpolation is not used for Approach 2 fitting. With fitting data alone, the report summarizes the two fitted models and uncertainty for those fitted curves. When prediction data are supplied, predictions can be generated by comparing the fitted in vivo and in vitro responses, by comparing fitted characteristic time constants when those values are available, or by inverse-mapping each observed prediction response through the fitted in vivo response-time curve.</p>
      <p>This approach can be useful when the two datasets were measured on different time schedules, when each dataset is expected to follow the same type of degradation curve, or when a specific model form is scientifically meaningful for both datasets.</p>
    fit_uncertainty_html: "\n            <p><strong>Parameter estimates:</strong> each in vitro and in vivo model parameter is reported as estimate ± 95% confidence interval. The plus-minus value is calculated from the corresponding fitted model's covariance matrix, parameter standard errors, and residual degrees of freedom. It summarizes how precisely each parameter was estimated from the available data.</p>\n            <p><strong>Time constants:</strong> tau values, when available, are calculated from the fitted model and parameter covariance. Reported tau values are shown as tau ± 95% confidence interval. The interval accounts for uncertainty in the fitted parameters used to calculate the time constant.</p>\n            <p><strong>Fitting plot bands:</strong> the in vitro and in vivo shaded 95% prediction bands are generated separately. For each fitted model, the app Monte Carlo samples the fitted parameter covariance matrix, combines sampled model variance with residual variance, and converts the resulting standard uncertainty to a two-sided interval using the appropriate Student's t multiplier when residual degrees of freedom are\
      \ available.</p>\n        "
    prediction_error_html: "\n            <p><strong>Response-value-ratio prediction error bars:</strong> uncertainty is propagated from both fitted models. The app samples each model's parameter covariance matrix, calculates the in vivo/in vitro response-value ratio for each sample, combines variance in that ratio with residual-based ratio uncertainty, and converts that uncertainty to a two-sided 95% interval. The plotted vertical error bars are scaled from the resulting ratio interval at each prediction time.</p>\n            <p><strong>Time-constant-ratio prediction error bars:</strong> when both tau values are valid, uncertainty from both tau values is carried through the ratio calculation. The resulting uncertainty in the scaled prediction time is converted to a symmetric 95% interval, where possible, and plotted as a horizontal error bar.</p>\n            <p><strong>Observed-response inverse mapping:</strong> each preprocessed observed prediction response is mapped to the time at which the fitted in vivo calibration curve reaches that response. This method uses the new in vitro response values directly. It is restricted to the observed in vivo calibration time range and requires the fitted in vivo curve to be one-to-one over that range. Response values outside the observed in vivo calibration response range are not extrapolated. If a response is within the observed range but lies just beyond the fitted curve at a calibration endpoint, it is mapped to that endpoint rather than discarded. Approximate 95% inverse-prediction intervals are generated by Monte Carlo sampling of the fitted in vivo parameter covariance and by treating the in vivo fit's residual standard error as the assumed uncertainty of the mapped response. This residual-scale assumption is a surrogate because the app does not have a separately measured error model for the new in vitro response.</p>\n            <p>Response-value ratio uncertainty can become unstable when the denominator model prediction or denominator time constant is near zero. Predictions in those regions may be sensitive to small changes in the fitted models.</p>\n        "
  approach3:
    title: 'Approach 3: Direct Mapping'
    method_html: |-
      <p>Approach 3 uses direct interpolation-based mappings between datasets rather than fitting a parametric model. Response values interpolated at shared times are used for response-value ratios over time, while times interpolated at shared response values are used for time ratios across response-value ranges. When prediction data are supplied, those mappings can be used to map in vitro response values or in vitro times to the corresponding in vivo response values or times.</p>
      <p>This approach can be useful for exploratory comparisons, for datasets where a simple equation does not describe the observed pattern well, or when the user wants a direct data-based mapping rather than a fitted model.</p>
    fit_uncertainty_html: "\n            <p><strong>Parameter uncertainty:</strong> Approach 3 does not fit a parametric model, so there is no fitted-parameter covariance matrix, no parameter confidence intervals, and no model-based 95% prediction band.</p>\n            <p><strong>Fitting plots:</strong> the plots show interpolation-based ratios/mappings calculated from the preprocessed datasets. They represent deterministic mappings from the supplied data and preprocessing choices, not statistical uncertainty bands.</p>\n        "
    prediction_error_html: "\n            <p><strong>Prediction plot error bars:</strong> Approach 3 does not generate formal propagated error bars for prediction outputs because no parametric covariance model is fitted.</p>\n            <p>Uncertainty is therefore limited to the quality of the input data, preprocessing, interpolation, and the assumption that the observed mapping remains valid for the prediction dataset. Extrapolated points outside the interpolation range are excluded or returned as unavailable.</p>\n        "
preprocessing:
  normalization:
    min_max:
      display_name: Min-max normalization
      description: Converts response values to a 0-1 scale using the observed minimum and maximum within each dataset.
    initial_value:
      display_name: Initial-value normalization
      description: Expresses each response value relative to the first response value in the corresponding dataset.
  scaling:
    log_x:
      display_name: Log10 time scaling
      description: Uses a base-10 log scale for time values before fitting or interpolation. All time values must be greater than zero. If this scaling is selected but the analyzed data contain a zero or negative time, the app leaves time unscaled, continues the analysis, and reports the fallback in Data Processing.
    log_y:
      display_name: Log10 response scaling
      description: Uses a base-10 log scale for response values before fitting or interpolation. All response values must be greater than zero after normalization. If this scaling is selected but the processed responses contain a zero or negative value, the app leaves response unscaled, continues the analysis, and reports the fallback in Data Processing.
  interpolation:
    none:
      display_name: No interpolation
      description: Uses only exact matches from the observed data. No response-at-time or time-at-response estimates are added, so unmatched positions remain unavailable for Approaches 1 and 3. Approach 2 uses observed points regardless of this setting.
    default:
      display_name: Shared-grid interpolation
      description: >-
        Uses linear interpolation in both directions: response values are estimated at the shared set of observed time points, and times are estimated at the shared set of observed response values. Estimates outside the measured overlap are unavailable. Approach 2 does not use these interpolated points for fitting.
    alternative:
      display_name: Densified interpolation
      description: Adds intermediate grid points in both time and response-value directions before linear interpolation, producing denser paired mappings for Approaches 1 and 3. The added points are estimates rather than additional experimental observations. Approach 2 does not use them for fitting.
metrics:
  r_squared:
    description: Coefficient of determination. Higher values indicate that the fitted curve follows more of the observed response pattern.
  adjusted_r_squared:
    description: R² adjusted for the number of fitted parameters. It can decrease when extra parameters do not improve the fit enough to justify the added complexity.
  mse:
    description: Average squared difference between observed and fitted values. Lower values indicate smaller model errors, but the squared units can be harder to interpret directly.
  rmse:
    description: Typical model error in the same response units as the fitted data. Lower values indicate predictions closer to the observations.
  mae:
    description: Average absolute model error in the same response units as the fitted data. Lower values indicate predictions closer to the observations.
  nrmse:
    description: RMSE divided by the response standard deviation. Lower values indicate smaller error relative to the amount of variation in the response.
  mnrmse:
    description: RMSE divided by the response mean. Lower values indicate smaller error relative to the typical response magnitude.
  aic:
    description: >-
      Akaike Information Criterion. AIC compares fitted models by considering both fit quality and the number of fitted parameters. Among comparable fitted models, a lower AIC value generally indicates better empirical support for a model that fits the data without unnecessary complexity. Absolute AIC values, including negative values, are not standalone quality grades.
  aicc:
    description: >-
      Corrected Akaike Information Criterion. AICc is AIC with an added small-sample correction that becomes increasingly relevant when the number of fitted observations is limited relative to the number of fitted parameters. See the user guide for additional information. Among comparable fitted models, a lower AICc value generally indicates better empirical support for a model that balances fit quality and complexity; AICc is undefined when there are too few observations relative to the number of parameters.
  bic:
    description: >-
      Bayesian Information Criterion. BIC compares fitted models by considering both fit quality and the number of fitted parameters, usually applying a stronger penalty for extra parameters than AIC. Among comparable fitted models, a lower BIC value generally indicates better empirical support for a model that fits the data without unnecessary complexity. Absolute BIC values, including negative values, are not standalone quality grades.
relative_model_evidence_html: |-
  <p>Relative model evidence compares candidate parametric models fitted to the same dataset using the same preprocessing settings and IVIVC approach. The table is shown only for selected information-criterion metrics: AIC, AICc, and/or BIC.</p>
  <p>In this context, empirical support means that the observed data provide more support for one model than another within the displayed candidate set, based on the selected information criterion. Lower information-criterion values indicate stronger relative support. The absolute values are not quality grades, and negative values are allowed.</p>
  <p><strong>Table definitions:</strong> <strong>n</strong> is the number of fitted observations; <strong>k</strong> is the number of fitted model parameters; <strong>Delta</strong> is the difference between a model's criterion value and the lowest value in the displayed candidate set; <strong>weight</strong> is the normalized relative support for that model under the criterion; and <strong>evidence ratio</strong> compares the highest weight in the set with the model's weight. Delta values near 0 indicate similar support; larger delta values indicate lower support relative to the leading candidate under that criterion.</p>
  <p>Similar empirical support does not mean the models are scientifically equivalent. Other considerations for choosing a final model include prediction error, cross-validation behavior, residual patterns, parameter uncertainty, model simplicity, and biological or degradation-mechanism plausibility. The app reports these summaries to support user review; it does not determine model selection or acceptability.</p>
cross_validation_summary_html: |-
  <p>The Cross-Validation Summary table reports mean CV scores for selected eligible metrics where cross-validation was run successfully. Ratio columns show the full-fit score divided by the cross-validation score for the same metric, and the CV comparison badge summarizes whether prediction performance on test data warrants closer review. Adjusted R² and information criteria (AIC, AICc, BIC) are excluded because the final model and cross-validation models are fitted using different data subsets. Detailed interpretation guidance is provided in the user guide.</p>
goodness_validation_table_html: |-
  <p>This table reports final scores for the fitted model for all selected metrics and mean cross-validation (CV) scores for eligible prediction metrics. Ratio rows show the full-fit score divided by the CV score for the same metric where that comparison is meaningful. Adjusted R² and information criteria (AIC, AICc, BIC) are shown for the final model but are not given CV values or ratios because the final model and cross-validation models are fitted using different data subsets. Detailed interpretation guidance is provided in the user guide.</p>
cv_fit_variability_html: |-
  <p>The CV fit variability plot compares the model fitted to all observations with the mean curve from the CV training-set fits. The shaded band is the pointwise mean ± one standard deviation across those CV fits. A wider band indicates that the fitted curve changes more depending on which observations are used for training. This band is a descriptive sensitivity diagnostic; it is not a confidence interval, prediction interval, or parameter-uncertainty interval.</p>
residual_diagnostics_html: |-
  <p>Residuals are calculated as observed minus predicted values. Raw residual plots show them in the original response units versus time. Each plot uses its own symmetric y-axis centered at zero. The axis covers the largest absolute residual but is not allowed to shrink below a small fraction of the observed response range, which prevents extremely small numerical residuals from being expanded to fill the plot.</p>
  <p>Normal quantile-quantile (Q-Q) plots compare ordered standardized residuals with the pattern expected under a normal distribution (i.e., a Gaussian distribution or bell curve). Points near the diagonal line are broadly consistent with normal residual variation, while curvature, tail departures, or isolated extreme points may suggest non-normality, outliers, or model mismatch. A Q-Q plot is not shown when residual variation is too small relative to the response scale to assess the distribution reliably. With small IVIVC datasets, Q-Q plots are intended for qualitative interpretation rather than pass/fail use.</p>
  <p>Residual diagnostics are intended for qualitative review. Points scattered around zero in the residual-vs-time plot are more consistent with a model form that captures the observed pattern, although they do not establish model validity. Sustained patterns, curvature, clustering, or adjacent time points with residuals mostly on the same side of zero may indicate bias or a model form that does not fully capture the data.</p>
parameter_diagnostics_comparison_html: |-
  <p>The Fitted Parameter Diagnostics table summarizes the diagnostic badges shown with each individual model fit. These badges flag models for closer review when they show large parameter uncertainty, parameter coupling, or parameter-identifiability cautions. Detailed explanations can be found in the individual fitting results and in the user guide.</p>
grid_search_description_html: |-
  <p>When the app fits a mathematical curve, it needs starting values for the model parameters. Poor starting values can lead to an unstable or unreasonable fit, especially for nonlinear models. Grid-search initialization reduces this risk by trying many candidate starting-value sets before nonlinear least-squares fitting.</p>
  <p>The app evaluates those candidate starts, chooses the most promising one, and then runs the final curve-fitting step from that starting point. This improves robustness, but it does not establish that the fit is the global optimum.</p>
cv_schemes:
  shuffle_split:
    display_name: Shuffle split
    description: Repeatedly creates random training and test subsets. This is the default because it provides a general robustness check of whether the selected curve form captures the overall response pattern. It is not time-aware, so random splits can make results look more reassuring when nearby observations are strongly related. The splits, test-size, and random-seed settings control the repeated random splits.
  leave_one_timepoint_out:
    display_name: Leave-one-timepoint-out
    description: Sets aside one time point at a time and fits the model using all remaining time points. This scheme may be informative for very small datasets because it uses as much data as possible for fitting while still checking how well the model predicts data not used for that fit. It is a gentle diagnostic and can be less demanding when adjacent time points are highly related.
  leave_contiguous_block_out:
    display_name: Leave-contiguous-block-out
    description: Sets aside adjacent time points as a block in x-axis order. The block-size setting controls how many adjacent observations are set aside in each split. This scheme may be informative when sensitivity to a missing time region is a primary concern. The maximum useful block size depends on the number of observations. Larger blocks can leave too few observations for stable fitting, especially in small datasets.
  none:
    display_name: None
    description: Disables cross-validation. This option is useful when the dataset is too small for meaningful CV, when repeated fitting is unstable, or when only summaries of the fitted model are needed.
analysis_parameters:
  cv_scheme:
    display_name: Cross-validation scheme
    description: Selects the splitting method used to estimate cross-validation performance for fitted parametric models. Shuffle split is the default general robustness check.
  cv_n_splits:
    display_name: CV splits/block size
    description: For Shuffle split, the number of repeated random train/test splits. For Leave-contiguous-block-out, the number of adjacent time points set aside per split. The setup page does not enforce a maximum block size because the uploaded data are not read until Analyze is selected; larger blocks may leave too few observations for stable fitting. This setting is not used for Leave-one-timepoint-out or None.
  cv_test_size:
    display_name: Shuffle split test size
    description: The fraction of observations used as test data in each Shuffle split repeat. Smaller values leave more observations for fitting; larger values make the test more demanding but leave fewer observations for training.
  cv_random_state:
    display_name: CV random seed
    description: Seed used to make randomized cross-validation splits reproducible. This applies to Shuffle split.
  grid_search_num_points:
    display_name: Grid-search random starts
    description: Number of candidate starting parameter sets evaluated before nonlinear least-squares fitting. Higher values may improve robustness but increase runtime.
  grid_search_num_cores:
    display_name: Grid-search CPU cores
    description: Number of CPU cores used for the starting-point search. Only available via command-line interface.
  grid_search_param_min:
    display_name: Grid-search parameter minimum
    description: Lower bound for randomly sampled candidate starting parameter values.
  grid_search_param_max:
    display_name: Grid-search parameter maximum
    description: Upper bound for randomly sampled candidate starting parameter values.
  grid_search_random_state:
    display_name: Grid-search random seed
    description: Seed used to make randomized starting-point sampling reproducible. Changing the seed changes the sampled candidates while keeping the same bounds and number of starts.
  include_raw_residual_plots:
    display_name: Raw residuals
    description: Shows residuals (i.e., errors) in the original response units versus time. Selected by default; users can hide it for a more compact results view.
  include_residual_qq_plots:
    display_name: Quantile-quantile (Q-Q) plots
    description: Shows qualitative normal quantile-quantile (Q-Q) diagnostics when residual variation is large enough to make the plot informative. Selected by default; users can hide it for a more compact results view.
  include_cv_fit_variability_plot:
    display_name: CV fit variability (mean ± SD)
    description: Shows the final full-data fit together with the mean and pointwise standard deviation of curves fitted to the cross-validation training subsets. The band describes sensitivity to the selected CV splits and is not a confidence or prediction interval.
modal_help:
  index:
    preprocessing_overview_html: |-
      <p>Preprocessing changes how the uploaded data are prepared before fitting, comparison, or prediction. The selected preprocessing choices are included in the results and downloadable report.</p>
      <ul>
        <li><strong>Normalization:</strong> expresses response values relative to a reference value, such as the first response value or the observed range.</li>
        <li><strong>Scaling:</strong> changes the numerical scale of time or response values, such as using a log scale, to help display or fit certain patterns.</li>
        <li><strong>Interpolation:</strong> can estimate response values at shared times and times at shared response values. Approach 1 uses the time-at-response representation, Approach 3 uses both directions, and Approach 2 fits the observed preprocessed points without interpolation.</li>
      </ul>
      <p>More information about each preprocessing option is available from the help buttons next to Normalization, Scaling, and Interpolation.</p>
    advanced_analysis_overview_html: |-
      <p>Advanced analysis parameters control three parts of the analysis workflow:</p>
      <ul>
        <li><strong>Cross-validation:</strong> how the app checks prediction performance by repeatedly setting aside part of the data and fitting to the rest, and whether the CV fit variability plot is shown.</li>
        <li><strong>Grid search:</strong> how the app searches for suitable starting parameter values before nonlinear least-squares fitting.</li>
        <li><strong>Residual diagnostics:</strong> whether raw residual (error) and normal quantile-quantile (Q-Q) plots are included in the results. Both are selected by default and can be hidden for a more compact results view.</li>
      </ul>
      <p>The default settings are intended as reasonable starting points. Possible reasons to adjust them include small datasets, unstable fits or cross-validation results, excessive runtime, or a preference for a more compact results view.</p>
    residual_diagnostics_html: |-
      <p>Residual diagnostics help assess whether model errors show patterns that may not be apparent from fit metrics alone.</p>
      <ul>
        <li><strong>Raw residuals:</strong> show observed minus predicted response values (i.e., the prediction errors) over time in the original response units. Each plot uses an independent symmetric axis and a minimum display range so very small residuals are not exaggerated visually.</li>
        <li><strong>Normal Q-Q plots:</strong> a quantile-quantile (Q-Q) plot provides a qualitative check of whether residuals are broadly consistent with a normal error pattern. When residual variation is too small relative to the response scale, the app shows a notice instead of a potentially misleading plot.</li>
      </ul>
      <p>Both options are selected by default. Deselect either option for a more compact results view.</p>
    cross_validation_html: |-
      <p>Cross-validation checks how selected fitted models predict data that were not used to fit that model. It is available for Approaches 1 and 2, where parametric models are fitted.</p>
      <p>The optional <strong>CV fit variability (mean ± SD)</strong> plot evaluates each CV training-set fit over the full displayed x-range, then shows the mean curve and a pointwise ±1 SD band together with the final full-data fit. The band shows how much the fitted relationship changes across CV splits. It is not a confidence or prediction interval.</p>
      <p>For time-course data, the main question is what kind of data are set aside for the prediction check. This app usually evaluates whether a fitted curve captures the overall response pattern, not whether early time points can forecast later time points. Shuffle split is the default because it provides a general robustness check of the fitted curve form. Even so, time order matters because nearby observations can be strongly related. Omitting one point is a gentle check, omitting a contiguous block is a stricter check of a time region, and shuffled splits do not preserve time order.</p>
      <ul>
        <li><strong>Shuffle split:</strong> default scheme. Repeatedly makes random training and test subsets and may be informative as a general robustness check of whether the fitted curve captures the overall response pattern. It is not time-aware and can look overly reassuring when neighboring time points are strongly related.</li>
        <li><strong>Leave-one-timepoint-out:</strong> may be informative for very small datasets because each fit uses all but one observation.</li>
        <li><strong>Leave-contiguous-block-out:</strong> may be informative when sensitivity to a missing time region is a primary concern. The <strong>block size</strong> setting controls how many adjacent observations are set aside per split. Larger blocks may leave too few observations for stable fitting. The setup page does not enforce a maximum block size because the uploaded data are not read until Analyze is selected.</li>
        <li><strong>None:</strong> skips cross-validation. This option is useful when there are too few observations for meaningful CV, when repeated fitting is unstable, or when only summaries of the fitted model are needed.</li>
      </ul>
      <p>Cross-validation results for small IVIVC datasets are intended as exploratory diagnostics and sensitivity checks. They complement, but do not replace, review of fitted plots, residual behavior, parameter uncertainty, and scientific plausibility.</p>
    grid_search_html: |-
      <p>When the app fits a mathematical curve, it needs starting values for the model parameters. Poor starting values can lead to an unstable or unreasonable fit, especially for nonlinear models. Grid-search initialization reduces this risk by trying many candidate starting-value sets before nonlinear least-squares fitting.</p>
      <p>The app evaluates those candidate starts, chooses the most promising one, and then runs the final curve-fitting step from that starting point. This improves robustness, but it does not establish that the fit is the global optimum.</p>
      <ul>
        <li><strong>Random starts:</strong> number of candidate starting value sets to try for each selected model. Higher values may improve robustness but increase runtime.</li>
        <li><strong>Parameter min:</strong> lower bound for candidate starting values.</li>
        <li><strong>Parameter max:</strong> upper bound for candidate starting values.</li>
        <li><strong>Random seed:</strong> makes the random sampling of candidate starting values reproducible. Changing the seed can help if a fit appears unreasonable, because different seeds will lead to different candidate starting value sets.</li>
      </ul>
      <p>The default settings are intended as reasonable starting points. Possible reasons to adjust them include small datasets, unstable fits, or excessive runtime.</p>
  results:
    model_comparison_html: |-
      <p>This tab provides side-by-side summaries of the fitted candidate models. It includes selected metric definitions, performance metrics, cross-validation summaries, fitted parameter diagnostic badges and Relative Model Evidence where information criteria are selected.</p>
      <p>Use the comparison tables together with the individual fitting plots, parameter diagnostics, residual plots, cross-validation behavior, and scientific expectations for the system.</p>
      <ul>
        <li><strong>Performance Metrics:</strong> fitted-data metrics selected by the user.</li>
        <li><strong>Cross-Validation Summary:</strong> CV scores and fit/CV ratios for eligible prediction metrics.</li>
        <li><strong>Fitted Parameter Diagnostics:</strong> compact badges that summarize parameter uncertainty, coupling, and identifiability checks from the individual model fits.</li>
        <li><strong>Relative Model Evidence:</strong> AIC/AICc/BIC-based relative summaries for comparable parametric models, when selected.</li>
      </ul>
      <p>The app does not automatically choose a model. The user selects the approach or model after reviewing the full set of outputs and considering the scientific rationale and intended use.</p>

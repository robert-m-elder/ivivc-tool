# Human-editable text used by the app, reports, and generated documentation.
# Routine wording changes should be made here. Restart the Flask app after edits.
# Regenerate LaTeX/PDF documentation after edits that should appear in the guide.

tool:
  purpose_html: |-
    <p>Establishing an in vitro-in vivo correlation (IVIVC) can support the evaluation of medical devices that include absorbable polymers by relating in vivo changes in material properties over time to corresponding in vitro test results, such as degradation profiles.</p>
    <p>IVIVCs may help evaluate manufacturing or material changes, support predictions of in vivo performance when modifying an existing device design, and reduce reliance on animal studies during preclinical development.</p>
    <p>This tool is intended to facilitate IVIVC development. The user supplies paired in vitro and in vivo fitting data, and may optionally supply an in vitro prediction dataset. The app applies selected preprocessing steps, fits and compares multiple correlation approaches and model families, evaluates selected performance metrics and cross-validation results, generates fitting and prediction plots, and produces report-ready summaries that can be reviewed and incorporated into external documentation.</p>
  purpose_text: |
    Establishing an in vitro-in vivo correlation (IVIVC) can support the evaluation of medical devices that include absorbable polymers by relating in vivo changes in material properties over time to corresponding in vitro test results, such as degradation profiles. IVIVCs may help evaluate manufacturing or material changes, support predictions of in vivo performance when modifying an existing device design, and reduce reliance on animal studies during preclinical development. This tool is intended to facilitate IVIVC development. The user supplies paired in vitro and in vivo fitting data, and may optionally supply an in vitro prediction dataset. The app applies selected preprocessing steps, fits and compares multiple correlation approaches and model families, evaluates selected performance metrics and cross-validation results, generates fitting and prediction plots, and produces report-ready summaries that can be reviewed and incorporated into external documentation.
  capability_summary:
  - Apply selected normalization, scaling, and interpolation options to prepare fitting and prediction data.
  - Fit user-selected IVIVC approaches and model families to paired in vitro and in vivo data.
  - Calculate selected goodness-of-fit, model-comparison, and cross-validation metrics.
  - Generate fitting, comparison, and prediction plots with uncertainty displays where supported.
  - Create report-ready HTML and editable Word summaries for user-selected final models or methods.
approaches:
  approach1:
    title: 'Approach 1: Direct Correlation'
    method_html: "\n            <p>Approach 1 fits a direct relationship between matched in vitro and in vivo time points after preprocessing. The fitted model is then used as a time-scaling function that maps an in vitro time to a predicted in vivo time.</p>\n        "
    fit_uncertainty_html: "\n            <p><strong>Parameter estimates:</strong> fitted parameters are reported as estimate &plusmn; standard error. Standard errors are derived from the nonlinear least-squares parameter covariance matrix. Correlations among fitted parameters are retained when uncertainty-aware parameter values are created.</p>\n            <p><strong>Fitting plot bands:</strong> shaded 95% prediction bands are generated by Monte Carlo sampling of the fitted parameter covariance matrix. The sampled model variance is combined with the residual variance from the fitted data, then converted to a two-sided interval using a t multiplier when residual degrees of freedom are available.</p>\n            <p>These bands describe approximate prediction uncertainty around the fitted relationship, not regulatory acceptance limits. They depend on the fitted model form, local covariance approximation, residual behavior, and preprocessing choices.</p>\n        "
    prediction_error_html: "\n            <p><strong>Prediction plot error bars:</strong> when a prediction dataset is supplied, predicted in vivo times are plotted with horizontal error bars. The bars are calculated from the same 95% prediction-band calculation used for the fitted correlation model; the upper and lower bar lengths are the distances from the band mean to the corresponding upper and lower interval bounds at each input prediction time.</p>\n            <p>The error bars therefore include propagated fitted-parameter uncertainty and residual/model error from the Approach 1 correlation fit.</p>\n        "
  approach2:
    title: 'Approach 2: Independent Model Fitting'
    method_html: "\n            <p>Approach 2 fits the same model family independently to the in vitro and in vivo datasets. With fitting data alone, the report summarizes the two fitted models and their fitted-curve uncertainty. When prediction data are supplied, predictions can be generated by comparing the fitted in vivo and in vitro responses or by comparing fitted characteristic time constants when those values are available.</p>\n        "
    fit_uncertainty_html: "\n            <p><strong>Parameter estimates:</strong> each in vitro and in vivo model parameter is reported as estimate &plusmn; standard error. Standard errors are derived from the corresponding nonlinear least-squares covariance matrix, with fitted-parameter correlations retained in uncertainty-aware values.</p>\n            <p><strong>Time constants:</strong> tau values, when available, are calculated from the fitted model and parameter covariance. The reported tau uncertainty is the propagated standard uncertainty from that covariance-based calculation.</p>\n            <p><strong>Fitting plot bands:</strong> the in vitro and in vivo shaded 95% prediction bands are generated separately. For each fitted model, the app Monte Carlo samples the fitted parameter covariance matrix, combines sampled model variance with residual variance, and converts the resulting standard uncertainty to a two-sided interval using a t multiplier when residual degrees of freedom are\
      \ available.</p>\n        "
    prediction_error_html: "\n            <p><strong>Value-ratio prediction error bars:</strong> uncertainty is propagated from both fitted models. The app samples each model's parameter covariance matrix, calculates the in vivo/in vitro response ratio for each sample, combines ratio variance with residual-based ratio uncertainty, and converts that uncertainty to a two-sided 95% interval. The plotted vertical error bars are scaled from the resulting ratio interval at each prediction time.</p>\n            <p><strong>Time-constant-ratio prediction error bars:</strong> when both tau values are valid, uncertainty in each tau is propagated through the tau ratio using uncertainty-aware arithmetic. The standard uncertainty of the scaled prediction time is multiplied by a t value, where available, and plotted as a symmetric horizontal error bar.</p>\n            <p>Ratio-based uncertainty can become unstable when the denominator model prediction or denominator time constant is near zero. Predictions\
      \ in those regions should be interpreted cautiously.</p>\n        "
  approach3:
    title: 'Approach 3: Direct Mapping'
    method_html: "\n            <p>Approach 3 uses direct interpolation-based mappings between datasets rather than fitting a parametric model. It can describe value-ratio behavior over time and time-ratio behavior over value ranges. When prediction data are supplied, those mappings can be used to scale prediction values or prediction times.</p>\n        "
    fit_uncertainty_html: "\n            <p><strong>Parameter uncertainty:</strong> Approach 3 does not fit a parametric model, so there is no fitted-parameter covariance matrix, no parameter standard errors, and no model-based 95% prediction band.</p>\n            <p><strong>Fitting plots:</strong> the plots show interpolation-based ratios/mappings calculated from the preprocessed datasets. They should be interpreted as deterministic mappings from the supplied data and preprocessing choices, not as statistical uncertainty bands.</p>\n        "
    prediction_error_html: "\n            <p><strong>Prediction plot error bars:</strong> Approach 3 currently does not generate formal propagated error bars for prediction outputs because no parametric covariance model is fitted.</p>\n            <p>Uncertainty is therefore limited to the quality of the input data, preprocessing, interpolation, and the assumption that the observed mapping remains valid for the prediction dataset. Extrapolated points outside the interpolation range are excluded or returned as unavailable.</p>\n        "
preprocessing:
  normalization:
    min_max:
      display_name: Min-max normalization
      description: Scales response values to the 0-1 range using the observed minimum and maximum within each dataset.
    initial_value:
      display_name: Initial-value normalization
      description: Divides response values by the first response value in the corresponding dataset.
  scaling:
    log_x:
      display_name: Log10 time scaling
      description: Applies a base-10 logarithm to time values before fitting or interpolation.
    log_y:
      display_name: Log10 response scaling
      description: Applies a base-10 logarithm to response values before fitting or interpolation.
  interpolation:
    none:
      display_name: No interpolation
      description: Uses only exact raw alignments. No values are estimated between observations; unavailable aligned positions are marked as missing.
    default:
      display_name: Shared-time interpolation
      description: Interpolates both datasets onto the common set of experimental time points, using linear interpolation and marking out-of-range values as unavailable.
    alternative:
      display_name: Densified interpolation
      description: Creates additional linearly spaced points between adjacent observations before interpolation. This can smooth displays and make fitting more stable, but adds more interpolation-derived points that skew statistical comparisons.
metrics:
  r_squared:
    description: Coefficient of determination. Higher values indicate that the model explains more variance in the observed response.
  adjusted_r_squared:
    description: R² adjusted for the number of fitted parameters. Higher values are better and can penalize unnecessary model complexity.
  mse:
    description: Mean squared error between observed and fitted values. Lower values indicate smaller average squared residuals.
  rmse:
    description: Root mean squared error, in the same response units as the fitted data. Lower values indicate smaller typical residuals.
  nrmse:
    description: RMSE normalized by the response standard deviation. Lower values indicate smaller error relative to response variability.
  mnrmse:
    description: RMSE normalized by the response mean. Lower values indicate smaller error relative to the response magnitude.
  aic:
    description: Akaike Information Criterion. Lower values indicate stronger relative fit-complexity support among models fitted to the same dataset under comparable assumptions. Absolute AIC values, including negative values, should not be interpreted as standalone quality grades.
  aicc:
    description: Corrected Akaike Information Criterion. AICc applies a small-sample correction to AIC and is often more appropriate when the number of fitted observations is small relative to the number of fitted parameters. Lower values indicate stronger relative fit-complexity support among comparable fitted models; AICc is undefined when there are too few observations relative to the number of parameters.
  bic:
    description: Bayesian Information Criterion. Lower values indicate stronger relative fit-complexity support among models fitted to the same dataset under comparable assumptions, with a stronger penalty for additional parameters than AIC. Absolute BIC values, including negative values, should not be interpreted as standalone quality grades.
relative_model_evidence_html: |-
  <p>Relative model evidence compares candidate parametric models fitted to the same dataset under the same preprocessing settings and IVIVC approach. The evidence table is based only on the information-criterion metrics selected by the user: AIC, AICc, and/or BIC. These criteria are relative; their absolute values are not interpreted directly, and negative values are allowed.</p>
  <p><strong>Table definitions:</strong> <strong>n</strong> is the number of fitted observations; <strong>k</strong> is the number of fitted model parameters; <strong>Delta</strong> is the difference between a model's criterion value and the lowest value in the displayed candidate set; <strong>weight</strong> is the normalized relative support for that model under the criterion; and <strong>evidence ratio</strong> compares the highest weight in the set with the model's weight. Delta values near 0 indicate similar relative support; larger delta values indicate lower support relative to the leading candidate under that criterion.</p>
  <p>Similar relative evidence does not mean the models are scientifically equivalent. Final model selection should also consider prediction error, cross-validation behavior, residual patterns, parameter uncertainty, model simplicity, and biological or degradation-mechanism plausibility.</p>
  <p>The app reports these summaries to support user review. It does not select, recommend, or validate a model.</p>
relative_model_evidence_text: |-
  Relative model evidence compares candidate parametric models fitted to the same dataset under the same preprocessing settings and IVIVC approach. The evidence table is based only on the information-criterion metrics selected by the user: AIC, AICc, and/or BIC. These criteria are relative; their absolute values are not interpreted directly, and negative values are allowed. Table definitions: n is the number of fitted observations; k is the number of fitted model parameters; Delta is the difference between a model's criterion value and the lowest value in the displayed candidate set; weight is the normalized relative support for that model under the criterion; and evidence ratio compares the highest weight in the set with the model's weight. Delta values near 0 indicate similar relative support; larger delta values indicate lower support relative to the leading candidate under that criterion. Similar relative evidence does not mean the models are scientifically equivalent. Final model selection should also consider prediction error, cross-validation behavior, residual patterns, parameter uncertainty, model simplicity, and biological or degradation-mechanism plausibility. The app reports these summaries to support user review. It does not select, recommend, or validate a model.
cross_validation_description_html: |-
  <p>Cross-validation provides an approximate check of how a fitted model performs on held-out data. It is most useful when there are enough observations to fit the model repeatedly while leaving some observations out for evaluation.</p>
  <p>The available schemes are Shuffle split, K-fold, Leave-one-out, and None. Shuffle split uses repeated random holdout sets, K-fold uses systematic fold-based holdouts, Leave-one-out holds out one observation at a time, and None disables cross-validation. For small IVIVC datasets, cross-validation summaries should be interpreted as exploratory diagnostics rather than definitive validation results.</p>
cross_validation_summary_html: |-
  <p>The Cross-Validation Summary table reports the mean held-out score for each selected eligible metric where cross-validation was run successfully. For each metric, <strong>CV [metric]</strong> is the mean cross-validation score and <strong>Ratio [metric]</strong> is the fitted-model score divided by the cross-validation score. For models with consistent fitted and cross-validation performance, the fit/CV ratio is expected to be near 1. Substantial deviations from 1 may indicate a poor model (e.g., reduced generalizability, overfitting, instability), but no universal acceptance threshold is established. Information criteria (AIC, AICc, BIC) are excluded from this table because the final model and cross-validation models are fitted to different (sub)sets of the data, so they cannot be compared.</p>
grid_search_description_html: |-
  <p>The app conducts an automated grid search to identify suitable starting parameter values for each model before nonlinear least-squares fitting, reducing the need for manual parameter tuning. Candidate values are sampled within the configured parameter bounds and are used only to initialize the final curve fit.</p>
  <p>This initialization step improves convergence and reduces sensitivity to poor starting values. It is not itself the final fitting algorithm and does not guarantee that the final fitted parameters are the global optimum.</p>
cv_schemes:
  shuffle_split:
    display_name: Shuffle split
    description: Repeatedly creates random training and holdout subsets. This can be useful when the dataset has enough observations to support repeated resampling. The test-size parameter controls the fraction held out in each split, and the random seed makes the random splits reproducible.
  kfold:
    display_name: K-fold
    description: Divides the dataset into a specified number of folds, fits the model on all but one fold, and evaluates on the held-out fold. Each fold is used once as the holdout set. The splits/folds parameter controls the number of folds. The data are randomly shuffled before splitting into folds (e.g., to avoid folds with only short-time data being used to predict long-time data), and the random seed makes the shuffling reproducible.
  leave_one_out:
    display_name: Leave-one-out
    description: Uses one observation as the holdout set and fits the model on all remaining observations, repeating until each observation has been held out once. This can be useful for very small datasets, but the results can be variable and computationally slower.
  none:
    display_name: None
    description: Disables cross-validation. This may be appropriate when the dataset is too small for meaningful holdout validation or when only fitted-model summaries are needed.
analysis_parameters:
  cv_scheme:
    display_name: Cross-validation scheme
    description: Selects the splitting method used to estimate held-out performance for fitted parametric models.
  cv_n_splits:
    display_name: CV splits/folds
    description: For Shuffle split, the number of repeated random train/test splits. For K-fold, the number of folds. This setting is not used for Leave-one-out or None.
  cv_test_size:
    display_name: ShuffleSplit test size
    description: The fraction of observations held out for testing in each Shuffle split repeat. Smaller values leave more observations for fitting; larger values make the holdout test more demanding but leave fewer observations for training.
  cv_random_state:
    display_name: CV random seed
    description: Seed used to make randomized cross-validation splits reproducible. This applies to Shuffle split and shuffled K-fold.
  grid_search_num_points:
    display_name: Grid-search random starts
    description: Number of candidate starting parameter sets evaluated before nonlinear least-squares fitting. Higher values may improve robustness but increase runtime.
  grid_search_num_cores:
    display_name: Grid-search CPU cores
    description: Number of CPU cores used for the starting-point search. Blank or Auto uses the app default.
  grid_search_param_min:
    display_name: Grid-search parameter minimum
    description: Lower bound for randomly sampled candidate starting parameter values.
  grid_search_param_max:
    display_name: Grid-search parameter maximum
    description: Upper bound for randomly sampled candidate starting parameter values.
  grid_search_random_state:
    display_name: Grid-search random seed
    description: Seed used to make randomized starting-point sampling reproducible. Changing the seed changes the sampled candidates while keeping the same bounds and number of starts.
modal_help:
  index:
    preprocessing_overview_html: |-
      <p>Transform your data before analysis to improve model fitting and comparability. The selected preprocessing choices are included in the results and downloadable Word report.</p>
      <ul>
        <li><strong>Normalization:</strong> optional transformations applied to response values.</li>
        <li><strong>Scaling:</strong> optional mathematical transformations applied to time or response values.</li>
        <li><strong>Interpolation:</strong> methods used to create matched time and response grids for fitting or direct mapping.</li>
      </ul>
      <p>More information about each preprocessing option is available from the help buttons next to Normalization, Scaling, and Interpolation.</p>
    advanced_analysis_overview_html: |-
      <p>Advanced analysis parameters control two separate parts of the analysis workflow:</p>
      <ul>
        <li><strong>Cross-validation:</strong> how the app estimates held-out performance for fitted parametric models.</li>
        <li><strong>Grid search:</strong> how the app searches for suitable starting parameter values before nonlinear least-squares fitting.</li>
      </ul>
      <p>The defaults are intended as reasonable starting points. Adjust these settings when datasets are small, fits are unstable, runtime is excessive, or a reproducible analysis configuration is needed.</p>
    cross_validation_html: |-
      <p>Cross-validation estimates how selected fitted models perform on held-out data. It is used for Approaches 1 and 2, where parametric models are fitted.</p>
      <ul>
        <li><strong>Shuffle split:</strong> repeatedly makes random training and holdout subsets. Use <strong>splits/folds</strong> for the number of repeats, <strong>test size</strong> for the held-out fraction, and <strong>random seed</strong> for reproducibility.</li>
        <li><strong>K-fold:</strong> divides the data into the selected number of folds and holds out each fold once. Use <strong>splits/folds</strong> for the number of folds. The random seed controls the shuffled fold assignment.</li>
        <li><strong>Leave-one-out:</strong> holds out one observation at a time and fits on all remaining observations. This can be useful when datasets are very small, but results can be variable and fitting can be slower.</li>
        <li><strong>None:</strong> skips cross-validation. This may be appropriate when there are too few observations for meaningful holdout validation or when only fitted-model summaries are needed.</li>
      </ul>
      <p>Cross-validation results for small IVIVC datasets should be treated as exploratory diagnostics. They complement, but do not replace, review of fitted plots, residual behavior, parameter uncertainty, and scientific plausibility.</p>
    grid_search_html: |-
      <p>The grid search identifies suitable starting parameter values before nonlinear least-squares fitting. It randomly samples parameter space according to the parameters below, conducts least-squares fitting for each parameter set, and then uses the best-performing parameter set for the final fit. This reduces the need for manual parameter tuning.</p>
      <ul>
        <li><strong>Random starts:</strong> number of candidate starting parameter sets to evaluate for each selected model. Higher values may improve robustness but increase runtime.</li>
        <li><strong>Parameter min:</strong> lower bound for sampled starting parameter values.</li>
        <li><strong>Parameter max:</strong> upper bound for sampled starting parameter values. Candidate values are sampled logarithmically by magnitude within the min/max range, allowing negative and positive starting values when the range crosses zero.</li>
        <li><strong>Random seed:</strong> makes the random sampling of candidate starting values reproducible. Changing the seed can help if a fit appears unstable.</li>
      </ul>
      <p>For each selected model, the app evaluates the candidate starting values and uses the best candidate as the starting point for the final curve fit. If fitting fails or appears unstable, consider increasing the number of random starts, adjusting the parameter bounds, changing the random seed, or reviewing whether the selected model is appropriate for the data.</p>
  results:
    model_comparison_html: |-
      <p>This section summarizes how each fitted model performed under the user-selected metrics, cross-validation summary tables, and, where applicable, Relative Model Evidence tables. Use these results together with the fitting plots, prediction plots where available, parameter uncertainty, residual behavior, and scientific expectations for the system.</p>
      <p>The metric definitions and better/worse direction are shown in the Model Comparison tab itself, so this help box intentionally provides only a high-level interpretation guide.</p>
      <ul>
        <li>Error metrics generally summarize the size of residuals.</li>
        <li>R²-type metrics summarize explained response variability.</li>
        <li>AIC/AICc/BIC-type metrics support relative comparison among candidate parametric models fitted to the same dataset under comparable assumptions.</li>
        <li>Cross-validation scores summarize held-out performance from the selected CV scheme. Ratio columns show fitted score divided by CV score for the same metric.</li>
        <li>Delta values, evidence weights, and evidence ratios are relative summaries; they do not prove that a model is correct, mechanistic, predictive outside the fitted range, or suitable for a regulatory submission.</li>
      </ul>
      <p>The app does not automatically choose a model. The user should review the full set of outputs and select the model or method that is scientifically justified for the intended use.</p>
